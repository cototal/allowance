{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="row">
    <div class="col-md-6 col-lg-4">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h1 class="h3 mb-3">Please sign in</h1>
            <label for="username" class="form-label">Username</label>
            <input type="text" value="{{ last_username }}" name="username" id="username" class="form-control mb-3" autocomplete="username" required autofocus>
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control mb-3" autocomplete="current-password" required>
            <div class="form-check mb-3">
                <input type="checkbox" name="_remember_me" id="remember_me" class="form-check-input">
                <label for="remember_me" class="form-check-label">Remember me</label>
            </div>
            <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
